version: '3.8'

services:
  # PostgreSQL Database
  postgres:
    image: postgres:15-alpine
    container_name: flash_loan_db
    environment:
      POSTGRES_USER: flashloan
      POSTGRES_PASSWORD: flashloan_dev_password
      POSTGRES_DB: flash_loan_safety
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U flashloan" ]
      interval: 10s
      timeout: 5s
      retries: 5

  # Redis Cache
  redis:
    image: redis:7-alpine
    container_name: flash_loan_redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: [ "CMD", "redis-cli", "ping" ]
      interval: 10s
      timeout: 5s
      retries: 5

  # FastAPI Backend
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: flash_loan_backend
    environment:
      DATABASE_URL: postgresql://flashloan:flashloan_dev_password@postgres:5432/flash_loan_safety
      REDIS_URL: redis://redis:6379/0
      LOG_LEVEL: DEBUG
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      # Mount code for development (hot reload)
      - .:/app
    command: uvicorn api_endpoint:app --host 0.0.0.0 --port 8000 --reload

volumes:
  postgres_data:
  redis_data:
